<!doctype HTML>
<html>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">

<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
  
  #debug-info {
    position: fixed;
    top: 10px;
    right: 10px;
    background-color: rgba(0, 0, 0, 0.9);
    color: white;
    padding: 10px;
    border-radius: 5px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    z-index: 10000;
    max-width: 250px;
  }
  
  #debug-info div {
    margin: 4px 0;
  }
  
  .debug-success {
    color: #4CAF50;
    font-weight: bold;
  }
  
  .debug-error {
    color: #FF5722;
    font-weight: bold;
  }
  
  .debug-warning {
    color: #FFC107;
  }
  
  .debug-info {
    color: #FFFFFF;
  }
</style>
<body style="margin: 0px; overflow: hidden;">
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
  
  <!-- Debug info display in upper right corner -->
  <div id="debug-info">
    <strong>DEBUG LOG:</strong>
    <div id="debug-messages"></div>
  </div>
  
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Sticker 1: Specialty Logo - Always available, starts the quest -->
    <a-nft
      id="specialtyMarker"
      type="nft"
      url="./images/specialty"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        position="-125 -200 -100"
        scale="75 75 75"
        gltf-model="assets/laptop.glb"
        rotation="-90 0 0"
      ></a-entity>
      <a-text value="#Find Student Fuel" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 2: Coffee Cup - Unlocked after Specialty -->
    <a-nft
      id="cofyMarker"
      type="nft"
      url="./images/cofy"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="cofyModel"
        position="125 0 -300"
        scale="50 50 50"
        gltf-model="assets/coffe_cup.glb"
        rotation="-90 75 0"
        visible="false"
      ></a-entity>
      <a-text value="#Find Humour" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 3: Coding Joke - Unlocked after Coffee -->
    <a-nft
      id="jokeMarker"
      type="nft"
      url="./images/joke"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="jokeModel"
        position="100 -250 -250"
        scale="0 0 0"
        gltf-model="assets/emoji_laugh.glb"
        rotation="-90 0 0"
        visible="false"
      ></a-entity>
      <a-text value="#Find Function" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 4: Sigmoid - Final stage, unlocked after Joke -->
    <a-nft
      id="sigmoidMarker"
      type="nft"
      url="./images/sigmoid"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="sigmoidModel"
        position="100 -250 -250"
        scale="10 10 10"
        gltf-model="assets/graduation_cap.glb"
        rotation="-90 0 0"
        visible="false"
      ></a-entity>
      <a-text value="#Congrats! You Survived University" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let specialtyScanned = false;
    let cofyScanned = false;
    let jokeScanned = false;

    // Add debug message to screen
    function addDebugMessage(message, type = 'info') {
      const debugDiv = document.getElementById('debug-messages');
      if (debugDiv) {
        const msg = document.createElement('div');
        msg.textContent = message;
        msg.className = 'debug-' + type;
        debugDiv.appendChild(msg);
        
        // Keep only last 8 messages
        while (debugDiv.children.length > 8) {
          debugDiv.removeChild(debugDiv.firstChild);
        }
      }
    }

    document.querySelector('a-scene').addEventListener('loaded', function() {
      addDebugMessage('Scene loaded! Quest ready.', 'success');
      addDebugMessage('Scan SPECIALTY marker first!', 'warning');
      
      const specialtyMarker = document.querySelector('#specialtyMarker');
      const cofyMarker = document.querySelector('#cofyMarker');
      const jokeMarker = document.querySelector('#jokeMarker');
      const sigmoidMarker = document.querySelector('#sigmoidMarker');
      
      const cofyModel = document.querySelector('#cofyModel');
      const jokeModel = document.querySelector('#jokeModel');
      const sigmoidModel = document.querySelector('#sigmoidModel');

      // When specialty marker found
      specialtyMarker.addEventListener('markerFound', function() {
        console.log('Specialty marker found!');
        addDebugMessage('✓ SPECIALTY found!', 'success');
        specialtyScanned = true;
        addDebugMessage('Next: Scan COFFEE marker', 'warning');
      });

      specialtyMarker.addEventListener('markerLost', function() {
        addDebugMessage('Specialty marker lost', 'info');
      });

      // When cofy marker found
      cofyMarker.addEventListener('markerFound', function() {
        console.log('Coffee marker found!');
        addDebugMessage('Coffee marker detected', 'info');
        if (specialtyScanned) {
          cofyModel.setAttribute('visible', 'true');
          cofyScanned = true;
          addDebugMessage('✓ COFFEE unlocked!', 'success');
          addDebugMessage('Next: Scan JOKE marker', 'warning');
          console.log('Coffee model is now visible!');
        } else {
          addDebugMessage('✗ BLOCKED! Scan SPECIALTY first', 'error');
          console.log('Specialty marker must be scanned first!');
        }
      });

      cofyMarker.addEventListener('markerLost', function() {
        cofyModel.setAttribute('visible', 'false');
        addDebugMessage('Coffee marker lost', 'info');
      });

      // When joke marker found
      jokeMarker.addEventListener('markerFound', function() {
        console.log('Joke marker found!');
        addDebugMessage('Joke marker detected', 'info');
        if (cofyScanned) {
          jokeModel.setAttribute('visible', 'true');
          jokeScanned = true;
          addDebugMessage('✓ JOKE unlocked!', 'success');
          addDebugMessage('Final: Scan SIGMOID marker', 'warning');
          console.log('Joke model is now visible!');
        } else {
          addDebugMessage('✗ BLOCKED! Scan COFFEE first', 'error');
          console.log('Coffee marker must be scanned first!');
        }
      });

      jokeMarker.addEventListener('markerLost', function() {
        jokeModel.setAttribute('visible', 'false');
        addDebugMessage('Joke marker lost', 'info');
      });

      // When sigmoid marker found
      sigmoidMarker.addEventListener('markerFound', function() {
        console.log('Sigmoid marker found!');
        addDebugMessage('Sigmoid marker detected', 'info');
        if (jokeScanned) {
          sigmoidModel.setAttribute('visible', 'true');
          addDebugMessage('✓ SIGMOID unlocked!', 'success');
          addDebugMessage('🎉 Quest complete!', 'success');
          console.log('Sigmoid model is now visible! Quest complete!');
        } else {
          addDebugMessage('✗ BLOCKED! Scan JOKE first', 'error');
          console.log('Joke marker must be scanned first!');
        }
      });

      sigmoidMarker.addEventListener('markerLost', function() {
        sigmoidModel.setAttribute('visible', 'false');
        addDebugMessage('Sigmoid marker lost', 'info');
      });
    });
  </script>
</body>
</html>
