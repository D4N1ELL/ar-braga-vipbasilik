<!doctype HTML>
<html>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">

<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
</style>
<body style="margin: 0px; overflow: hidden;">
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>
  
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Sticker 1: Specialty Logo - Always available, starts the quest -->
    <a-nft
      id="specialtyMarker"
      type="nft"
      url="./images/specialty"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        position="-125 -200 -100"
        scale="75 75 75"
        gltf-model="assets/laptop.glb"
        rotation="-90 0 0"
      ></a-entity>
      <a-text value="#1 - Scan SPECIALTY logo" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 2: Coffee Cup - Unlocked after Specialty -->
    <a-nft
      id="cofyMarker"
      type="nft"
      url="./images/cofy"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="cofyModel"
        position="125 0 -300"
        scale="50 50 50"
        gltf-model="assets/coffe_cup.glb"
        rotation="-90 75 0"
        visible="false"
      ></a-entity>
      <a-text value="#2 - Find COFFEE cup" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 3: Coding Joke - Unlocked after Coffee -->
    <a-nft
      id="jokeMarker"
      type="nft"
      url="./images/joke"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="jokeModel"
        position="100 -250 -250"
        scale="10 10 10"
        gltf-model="assets/emoji_laugh.glb"
        rotation="-90 0 0"
        visible="false"
      ></a-entity>
      <a-text value="#3 - Find CODING JOKE" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <!-- Sticker 4: Sigmoid - Final stage, unlocked after Joke -->
    <a-nft
      id="sigmoidMarker"
      type="nft"
      url="./images/sigmoid"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-entity
        id="sigmoidModel"
        position="100 -250 -250"
        scale="10 10 10"
        gltf-model="assets/graduation_cap.glb"
        rotation="-90 0 0"
        visible="false"
      ></a-entity>
      <a-text value="#4 - Final SIGMOID" align="center" color="#FFFFFF" width="8" position="0 -20 -20" rotation="-90 0 0" scale="50 50 50"></a-text>
    </a-nft>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let specialtyScanned = false;
    let cofyScanned = false;
    let jokeScanned = false;

    document.querySelector('a-scene').addEventListener('loaded', function() {
      const specialtyMarker = document.querySelector('#specialtyMarker');
      const cofyMarker = document.querySelector('#cofyMarker');
      const jokeMarker = document.querySelector('#jokeMarker');
      const sigmoidMarker = document.querySelector('#sigmoidMarker');
      
      const cofyModel = document.querySelector('#cofyModel');
      const jokeModel = document.querySelector('#jokeModel');
      const sigmoidModel = document.querySelector('#sigmoidModel');

      // When specialty marker found
      specialtyMarker.addEventListener('markerFound', function() {
        console.log('Specialty marker found!');
        specialtyScanned = true;
      });

      // When cofy marker found
      cofyMarker.addEventListener('markerFound', function() {
        console.log('Coffee marker found!');
        if (specialtyScanned) {
          cofyModel.setAttribute('visible', 'true');
          cofyScanned = true;
          console.log('Coffee model is now visible!');
        } else {
          console.log('Specialty marker must be scanned first!');
        }
      });

      cofyMarker.addEventListener('markerLost', function() {
        cofyModel.setAttribute('visible', 'false');
      });

      // When joke marker found
      jokeMarker.addEventListener('markerFound', function() {
        console.log('Joke marker found!');
        if (cofyScanned) {
          jokeModel.setAttribute('visible', 'true');
          jokeScanned = true;
          console.log('Joke model is now visible!');
        } else {
          console.log('Coffee marker must be scanned first!');
        }
      });

      jokeMarker.addEventListener('markerLost', function() {
        jokeModel.setAttribute('visible', 'false');
      });

      // When sigmoid marker found
      sigmoidMarker.addEventListener('markerFound', function() {
        console.log('Sigmoid marker found!');
        if (jokeScanned) {
          sigmoidModel.setAttribute('visible', 'true');
          console.log('Sigmoid model is now visible! Quest complete!');
        } else {
          console.log('Joke marker must be scanned first!');
        }
      });

      sigmoidMarker.addEventListener('markerLost', function() {
        sigmoidModel.setAttribute('visible', 'false');
      });
    });
  </script>
</body>
</html>
